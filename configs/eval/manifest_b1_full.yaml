# B1-full eval manifest — the pinned cloud designability set (hard⊕soft, K=8/N=8, λ=1).
#
# = curated-15 (≤256 res; docs/plan/12 §3 / configs/eval/manifest_curated15.yaml) EXTENDED with a
# long-10 (256–384 res) drawn from the SAME pinned test split (v1_seed0_8-1-1_lenstrat, §12 50-pool
# rows #31–#50). Purpose: firm the lean K=4 designability (docs/results/02 §4) at K=8 AND extend it to
# the big folds.
#
# ✅ CORRECTED 2026-08-31: THE LONG-10 ARE NOT H100-ONLY. This header said they were, and that "the
# A5000 can't refold" them. Both are false, and the belief has been steering work to the cloud for a
# reason that never existed. Measured on the 24 GB A5000 at RFdiffusion3's own 200-step / gamma_0 0.6
# sampler, K=8/N=8, the full pipeline through OpenFold3:
#   A0A2V8GJC1, L=374, the LONGEST entry here: 16/16 backbones generated (25.2 s/backbone) and all
#   128 refolds completed. 1 h 13 min end to end.
# What actually blocked it was a memory leak in our own pipeline, not the card. Stage 3 launches
# OpenFold3 as a subprocess, which needs its own CUDA context, and the parent held 21.70 GiB of
# RESERVED-BUT-UNALLOCATED PyTorch arena (only 1.47 GiB was live) after generation. The child got
# 1.55 GiB and died asking for 20 MiB. OpenFold3 alone needs ~4.3 GiB at 368 residues
# (dev docs/results/data/28_of3_length_ceiling.json), so it always fitted. spa.eval.flywheel now
# releases between stages, and an 80 GB H100 had simply always had enough slack to hide the leak,
# which is how "H100-only" came to be written here. Full record: dev docs/plan/81.
#
# Each entry yields BOTH a SPA soft-conditioning prompt (ESM3 [L,1536] .pt) AND a DSSP-carved self-motif
# (hard) spanning the full length (scripts/eval/carve_motif.py) — the hard⊕soft headline. pdb =
# <pdb_dir>/AF-<id>-F1-model_v4_esmfold_v1.pdb (local training_data; embeddings regenerated locally
# byte-identically, memory: esm3-weights-byte-identical-local-cloud). Prep: scripts/eval/prep_b1_full.py.

split_id: v1_seed0_8-1-1_lenstrat
pdb_pattern: "AF-{id}-F1-model_v4_esmfold_v1.pdb"
lambda_scale: 1
num_designs: 8
num_seqs: 8
spa_ckpt: spa-Nx1536-uncond/spa_C_final.pt   # Run A (N×1536, unconditional) — the emergent zero-shot headline ckpt

