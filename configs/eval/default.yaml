# SPA Stage-1 design-generation knobs (dev 05_validation_pipeline.md "Stage 0 — Generate (RFD3 ± SPA)").
# All cost knobs (K, λ, length, sampler steps) are tuned at run time — nothing here is hardcoded in code.
ckpt: null                 # trained SPA adapter checkpoint (null -> untrained zero-init == identity/vanilla)
conditions: [baseline, spa]   # baseline (clear_prompt == vanilla RFD3) and/or spa (set_prompt + λ)
lambda_scale: 1.0          # SPA strength λ; float or list (swept for spa only; baseline is λ=0). 0 -> unconditional
num_designs: 8             # K designs per (condition, λ) — the RFD3 diffusion batch (one engine.run -> K backbones)
length: 100                # design length (residues) for unconditional generation

# ⭐ Per-residue λ profile (dev results/42 §9-§10). null -> UNIFORM λ over every token, which is what
# every run before 2026-09-05 did, including the multimer and ligand probes: those steered the fixed
# partner chain, the chain-break token and the ligand's own tokens alongside the designed chain.
#
# ⛔ EXPLICIT BY DESIGN, NOT INFERRED FROM THE CONTIG. `tokens` is the total design-frame token count
# and `steered` a list of [start, end) spans that receive λ; everything else gets 0. Inferring these
# from a contig would be a silent-failure surface on the generation path, and this project has paid for
# those repeatedly. A wrong `tokens` raises rather than steering the wrong residues.
#
# Example, the multimeric binder `100,/0,A17-131` (100 designed + 115 target = 215 tokens), steering
# ONLY the designed chain:
#   profile: {tokens: 215, steered: [[0, 100]]}
# Example, a length-matched steered region with unconditioned spacers inside a 180-residue chain:
#   profile: {tokens: 180, steered: [[45, 134]]}
profile: null
specification: null        # optional RFD3 DesignInputSpecification dict (augments/overrides `length`)
num_timesteps: null        # RFD3 sampler steps (null -> effective default 100 from rfd3 edm.yaml, NOT the 200 its
                           #   docs/dataclass claim; verified 2026-07-03; set e.g. 200 to override. lower = faster/cheaper)
# The other two sampler knobs. null -> INHERIT FROM THE RELEASED CHECKPOINT, which is how this project
# silently ran at gamma_0=0.8 while the RFD3 paper used 0.6 throughout: the engine merges
# checkpoint["train_cfg"] with inference_sampler_overrides, so an unset key leaves the checkpoint's value
# standing. These were previously UNREACHABLE from config, not merely undocumented (review B4).
# RFD3 paper Fig. S4f: "step scale eta = 1.5, noise level gamma_0 = 0.6, and 200 denoising steps (used
# throughout this work unless otherwise specified)". Released checkpoint ships 100 / 0.8.
# generate.py reads the values back off the LIVE sampler and ABORTS if an override did not take effect.
gamma_0: null              # RFD3 sampler noise level (null -> checkpoint's 0.8; RFD3 paper uses 0.6)
step_scale: null           # RFD3 sampler step scale, eta (null -> checkpoint's 1.5; RFD3 paper uses 1.5)
# EVERY OTHER RFD3 sampler knob, namespaced. The three above are reachable at the top level only for
# backwards compatibility; anything else in SampleDiffusionConfig goes here, e.g.
#   +eval.sampler.gamma_min=2.0   +eval.sampler.use_classifier_free_guidance=true
# Validated by INTROSPECTION against SampleDiffusionConfig, so an unknown field RAISES instead of
# being silently dropped, and a top-level eval.<sampler-field> raises too and names this block as the
# fix. Before this existed, `+eval.gamma_min=2.0` was accepted by Hydra and then silently ignored:
# the run reported success and generated at the checkpoint's value. See spa.eval.generate
# .resolve_sampler_overrides and dev docs/plan/81 §7d. Namespaced rather than top-level so a future
# eval key named `p` or `kind` cannot become a sampler override by accident.
sampler: null
# EVERY OTHER RFD3 *engine* field (RFD3InferenceConfig), namespaced the same way. SPA computes six of
# its twenty from other keys (ckpt_path, diffusion_batch_size, specification, inference_sampler, seed,
# dump_trajectories) and those are REFUSED here so one knob keeps one spelling; the remaining fourteen
# were unreachable until now, e.g.
#   +eval.engine.low_memory_mode=true   +eval.engine.prevalidate_inputs=false
# Same introspective validation and same top-level-key guard as `sampler` above. Unlike the sampler
# these need no readback check: they are dataclass keyword arguments, set by construction rather than
# merged onto the checkpoint's train_cfg. See spa.eval.generate.resolve_engine_overrides.
engine: null
seed: 0                    # re-seeded before EVERY sampler run -> reproducible + paired noise across (condition, λ)

# ⭐ OPT-IN bitwise determinism (dev plan/91). false -> today's behaviour, byte-identical: nothing is
# patched at import, so an unset/false run cannot differ from stock. true -> replaces RFD3's ONE
# order-unstable op (foundry scatter_mean's Tensor.index_reduce, CUDA atomics) with an order-stable
# one-hot matmul, making generation bit-identical across independent processes. Cost-neutral
# (20.24 s vs 20.39 s at L=100/K=4). No torch determinism flags or env vars are needed or used:
# use_deterministic_algorithms RAISES on index_reduce, and with warn_only=True it silently does nothing.
# ⛔ ENABLING THIS CHANGES THE NUMBERS. It does NOT reproduce anything the stock build generated
# (0.056 to 2.469 A from stock at the same seed); it is a go-forward guarantee only.
# ⛔ The guarantee is a TUPLE: same seed AND same num_designs (K) AND same GPU model AND same torch
# build. Design i at K=4 differs from K=8 by up to 2.433 A, from shape-dependent GEMM kernel choice.
deterministic: false
ladder: null               # checkpoint-step ADHERENCE LADDER (scripts/eval/ladder_sweep.py, dev 13): list of
                           #   snapshot paths to sweep (adherence vs training step). null -> not a ladder run.

# Prompt for condition=spa (the same structure-only ESM3 tap training used). Provide ONE:
prompt_pdb: null           # a structure file -> spa.prompt.esm3_prompt -> [N,1536] (ESM3 loaded once, then freed)
prompt_cache: null         # OR a precomputed [N,1536] .pt (cloud/ESM3 cache reuse; skips ESM3)
use_sequence: false        # structure-only prompt by default (dev 01 §3.5)
prompt_id: null            # output-name group id (null -> prompt file stem, else "design")

# Sub-region "scaffolding" eval (dev 17 §7 / 16 §9.5) — the multigranularity ("editing") probe.
# null -> off (byte-identical to today). When set, SPA conditions on a SUB-REGION S of the prompt
# only: generate.py masks the prompt to the kept rows (key_padding_mask True at rows ∉ S), and the
# flywheel scores sub-region motif-RMSD (design[S] / refold[S] vs prompt[S], self-aligned). Requires
# eval.length == N == the prompt-structure length so S indexes the design and prompt identically.
# MUTUALLY EXCLUSIVE with eval.motif (that path masks S; this one keeps S). N×1536 (variant C) only,
# per dev 17 §5 (pooled variants drop a per-residue mask). Usually driven by scripts/eval/run_scaffold_eval.py.
subregion: null            # e.g. {keep: [0,1,...,59]}  (0-based residue indices of S; attend to these rows only)

out_dir: ${paths.outputs_root}/_incoming/generate   # ABSOLUTE + run-scoped (dev plan/30 §6).
                                   # Was ./outputs/eval/generate — a *relative* path resolved against the
                                   # invoking cwd, so output landed in whichever repo Hydra was launched
                                   # from. Override per run: eval.out_dir=<abs path>.

# SPA Stage-2 inverse-folding knobs (dev 05_validation_pipeline.md "Stage 2 — Inverse fold (ProteinMPNN)").
# ProteinMPNN runs as a subprocess on its protein_mpnn_run.py (a script, not cleanly importable);
# PDB->FASTA handoff is file-based (dev 05 §4). Repo path is in configs/paths/default.yaml.
proteinmpnn:
  num_seqs: 8              # N sequences per backbone (best-of-8 self-consistency set; primary cost lever)
  sampling_temp: 0.1      # ProteinMPNN sampling temperature (0.1 default; higher -> more diverse seqs)
  seed: 42                # ProteinMPNN RNG seed. MUST be non-zero: ProteinMPNN's `if args.seed:` treats
                          # 0 as falsy -> a fresh RANDOM seed each run -> best-of-N designability noise,
                          # NOT reproducible (discovered results/05 E8, 2026-07-05). 42 = fixed/reproducible.
  batch_size: 1           # must divide num_seqs (ProteinMPNN: NUM_BATCHES = num_seqs // batch_size)
  model_name: v_48_020    # bundled vanilla weights (dev 05 Stage 2 default; v_48_002/010/020/030)
  weights_dir: null       # null -> <paths.proteinmpnn_repo>/vanilla_model_weights (bundled default)
  ca_only: false          # full-atom backbone model (N,CA,C,O); true -> CA-only model
  conda_env: null         # null -> current interpreter (spa-dev, per Task 1.5); else `conda run -n <env>`
  designs: null           # explicit list of design PDBs; null -> design_dir / eval.out_dir glob *.pdb
  design_dir: null        # dir of Stage-1 design PDBs; null -> eval.out_dir (the Stage-1 output dir)
  out_dir: null           # null -> eval.out_dir, so FASTAs land in <eval.out_dir>/seqs/<design_stem>.fa
                          # — inside the run's OWN directory (mirrors design_dir's null -> eval.out_dir
                          # idiom above). Was ./outputs/eval/seqs, a SHARED path every run wrote into:
                          # ProteinMPNN's <out_dir>/seqs/ layout made that outputs/eval/seqs/seqs/, and
                          # because FASTAs are named only {design_stem}.fa (no run id), runs silently
                          # OVERWROTE each other — 7 dates of runs collapsed into one flat pile and only
                          # the last write of any reused name survived. Real data was lost that way
                          # (dev plan/30 §1.2 / results/12 §3). Do not point this at a shared path again.

# SPA Stage-4 scoring knobs (dev 05_validation_pipeline.md §3 "Metrics" / 06_experiments.md §6).
# Designability = best-of-K Cα scRMSD vs OF3 refolds; adherence = TM-score (+ Cα prompt-RMSD) vs the
# prompt's source structure. All thresholds are knobs (dev root CLAUDE.md), never hardcoded in code.
score:
  scrmsd_cutoff: 2.0      # Å — best-of-K scRMSD designability threshold (dev 05 §3 / 06 §6)
  scrmsd_atoms: CA        # atom set for scRMSD: CA (this project's criterion, paired with 2.0 Å above)
                          #   or "N,CA,C" (RFdiffusion3's own, which they pair with 1.5 Å). SET BOTH KNOBS
                          #   TOGETHER when calibrating against their published rates — changing one alone
                          #   is not comparable to anything. Default CA keeps every historical number
                          #   bit-identical. Used by the M6 calibration run (scripts/cloud/run_m6_calibration.sh).
  plddt_cutoff: 80.0      # OF3 pLDDT designability gate (applied only when a pLDDT is supplied)
  tm_norm: prompt         # primary adherence TM normalization: prompt (fraction of prompt fold) | design | max
  diversity: true         # pairwise-TM diversity among the designable set (lower mean TM = more diverse)
  novelty: false          # novelty-vs-PDB (Foldseek) — stubbed; true raises NotImplemented until wired up

# SPA flywheel orchestration knobs (dev 05_validation_pipeline.md §1–§4 — wires Stages 1→4 end-to-end).
# Stage 3 (OpenFold3 refold) is pluggable + STUBBED: with refolder=null, designability is skipped and
# scoring is adherence-only. Reuses eval.conditions/lambda_scale/num_designs (Stage 1), proteinmpnn
# (Stage 2), and score (Stage 4) above — only the two flywheel-specific knobs live here.
flywheel:
  # Stage 2 (ProteinMPNN) exists only to feed Stage 3 (OF3). true (default) = today's behaviour exactly.
  # Set false for a TIER-1 / adherence-only run: Stage 2 used to run even with refolder=null, paying
  # ProteinMPNN for sequences nothing folds (~1.67x the necessary wall-clock; dev plan/85 §2, plan/90
  # §5.0a P6). Designability is unreachable with this false, which is the point.
  inverse_fold: true
  prompt_struct: null     # structure file to score prompt-adherence against; null -> eval.prompt_pdb
                          #   (eval.prompt_cache is an ESM3 tensor, not a structure, so it cannot serve here)
  refolder: null          # OF3 refolder (a Hydra _target_ spec satisfying score.Refolder); null -> skip
                          #   designability (adherence-only). OF3 is NOT implemented — this is the injection point.
